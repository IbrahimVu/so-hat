<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Hạt</title>
<meta name="description" content="Sổ ghi lại các loại hạt cà phê đã thử: sơ chế, vùng trồng, độ rang, giá.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 16'%3E%3Cellipse cx='6' cy='8' rx='5' ry='7' fill='%237C5131'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one person's bean journal — profile header with stats, a filter/sort bar, then a photo-led grid; owner-only editing in a side sheet */
:root{
  --bg:#F3F4EE; --surface:#FFFFFF; --sunk:#E9EBE2; --ink:#231A15; --muted:#6B655C; --line:#D9DAD0;
  --accent:#9A2E3D; --accent-ink:#FFFFFF; --accent-soft:#F3E3E4; --leaf:#55704A; --leaf-soft:#E3EBDD;
  --r1:#CDA77D; --r2:#A97A4C; --r3:#7C5131; --r4:#55341D; --r5:#2C1B11;
  --f-display:"Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15110E; --surface:#1F1915; --sunk:#2A221D; --ink:#F0E8E0; --muted:#A79D92; --line:#3A302A;
  --accent:#E5838F; --accent-ink:#1C0F11; --accent-soft:#3A2024; --leaf:#A3BC94; --leaf-soft:#25301F;
  --r1:#D9B58C; --r2:#B98858; --r3:#8E603C; --r4:#6A4428; --r5:#4A2E1C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15110E; --surface:#1F1915; --sunk:#2A221D; --ink:#F0E8E0; --muted:#A79D92; --line:#3A302A;
  --accent:#E5838F; --accent-ink:#1C0F11; --accent-soft:#3A2024; --leaf:#A3BC94; --leaf-soft:#25301F;
  --r1:#D9B58C; --r2:#B98858; --r3:#8E603C; --r4:#6A4428; --r5:#4A2E1C; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

.bar{border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;gap:8px;align-items:center}
.brand svg{width:20px;height:26px}
.editchip{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.6;cursor:wait}

.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:28px 90px}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:22px}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--sunk);display:block}
.prof h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.03em}
.prof p{margin:8px 0 0;color:var(--muted);max-width:62ch;white-space:pre-wrap}
.prof .acts{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:24px}
.stats div{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:12.5px;color:var(--muted)}

.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.filters{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.sortbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto}
.sortbox select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.bean{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:4/3;background:var(--sunk);display:block;border:0;padding:0;width:100%;position:relative}
.ph{overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center}
.ph .noimg svg{width:34px;height:46px;opacity:.5}
.body{padding:12px 14px 14px;display:grid;gap:8px;flex:1}
.body h3{font-size:18px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.origin{font-size:13.5px;color:var(--muted);margin-top:-4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf);white-space:nowrap}
.roast{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.roast i{width:22px;height:8px;border-radius:2px;display:inline-block}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.price b{font-family:var(--f-mono);font-size:17px}
.price span{font-size:12px;color:var(--muted)}
.per100{font-size:12px;color:var(--muted);font-family:var(--f-mono);text-align:right;margin-top:-4px}
.foot{font-size:12.5px;color:var(--muted)}
.acts2{display:flex;gap:4px;flex-wrap:wrap}

.empty{border:1.5px dashed var(--line);border-radius:16px;padding:26px;display:grid;gap:12px;justify-items:start}
.empty h3{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:54ch}
.meter{font-size:12.5px;color:var(--muted);margin-top:28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meter .t{width:160px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter .t i{display:block;height:100%;background:var(--leaf)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 6 4 / .45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:21px;font-weight:800}
.sheet-b{overflow-y:auto;padding:18px;display:grid;gap:18px}
.sheet-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface)}
.field{display:grid;gap:6px}
.lbl{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.roastpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.roastpick button{border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;background:var(--surface);display:grid;font-size:11.5px}
.roastpick button i{height:26px;display:block}
.roastpick button span{padding:4px 2px}
.roastpick button[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.pricebox{position:relative}
.pricebox input{font-family:var(--f-mono);padding-right:30px}
.pricebox span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.unitrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.unitrow input{width:118px;padding:5px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.unitrow input.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.row2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);aspect-ratio:4/3;max-height:260px;width:100%;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;text-align:center;padding:12px}
.drop.round{aspect-ratio:1;max-height:none;width:120px;border-radius:50%;padding:6px;font-size:12px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .rm{position:absolute;top:8px;right:8px;z-index:2}
.drop .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgb(0 0 0 / .45);color:#fff;font-size:13px;z-index:1}

.saving{position:fixed;inset:0;z-index:90;background:rgb(10 6 4 / .35);display:grid;place-items:center}
.saving div{background:var(--surface);color:var(--ink);padding:14px 20px;border-radius:12px;font-weight:600}
.lightbox{position:fixed;inset:0;z-index:70;background:rgb(8 5 3 / .88);display:grid;place-items:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:95;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:640px){ .prof{grid-template-columns:auto minmax(0,1fr)} .prof .acts{grid-column:1/-1} .avatar{width:64px;height:64px} }
@media (max-width:520px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .body{padding:10px} .body h3{font-size:16px} .stats b{font-size:20px} .stats b[style]{font-size:15px} .stats div{padding:10px 12px} .row2{grid-template-columns:minmax(0,1fr)} }
@media (max-width:360px){ .grid{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:sl .2s ease-out} @keyframes sl{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<style>
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav a{padding:7px 12px;border-radius:999px;font-weight:500;color:var(--muted);text-decoration:none;font-size:14px}
.nav a[aria-current="true"]{background:var(--ink);color:var(--bg)}
.nav a:hover:not([aria-current="true"]){background:var(--sunk);color:var(--ink)}
.foot-links{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:flex;gap:12px;justify-content:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12.5px}
.linkbtn:hover{color:var(--ink)}
.help{font-size:13px;color:var(--muted);line-height:1.55}
.help ol{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.help a{color:var(--accent)}
.err{color:var(--accent);font-size:13px}
.editchip{margin-left:0}
.pgh{margin-bottom:20px}
.pgh h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.03em}
.pgh p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.person{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);min-width:0}
.person:hover{border-color:var(--ink)}
.person img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk)}
.person b{font-family:var(--f-display);font-size:18px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;margin-bottom:22px}
.panel h3{font-size:17px}
.keybox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.keybox input{flex:1 1 260px;min-width:0;font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.formcard{max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:16px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.adm{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
table.adm th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
table.adm td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.adm tr:last-child td{border-bottom:0}
table.adm img{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block;background:var(--sunk)}
table.adm .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.statrow div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.statrow b{font-family:var(--f-display);font-size:22px;display:block}
.statrow span{font-size:12px;color:var(--muted)}
.ts-box{min-height:66px}
@media (max-width:640px){ .nav{margin-left:0;width:100%} .nav a{flex:1;text-align:center;padding:7px 6px;font-size:13px} }
</style>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#" style="color:inherit;text-decoration:none"><svg viewBox="0 0 12 16" aria-hidden="true"><ellipse cx="6" cy="8" rx="5" ry="7" fill="var(--r3)"/><path d="M6.2 1.5c-2.2 3 2.2 6.5-.2 13" stroke="var(--bg)" stroke-width="1.2" fill="none"/></svg>Sổ Hạt</a>
  <nav class="nav" id="nav" aria-label="Điều hướng"></nav>
</div></header>
<main class="wrap" id="app"><p class="muted">Đang tải sổ hạt…</p></main>
<div class="foot-links" id="foot"></div>
<div id="sheetRoot"></div>
<div id="overlay"></div>
<script>
(() => {
/* ================= config ================= */
const FALLBACK_REPO="ibrahimvu/so-hat";
function detectRepo(){
  const h=location.hostname, seg=location.pathname.split("/").filter(Boolean)[0];
  if(h.endsWith(".github.io")){ const owner=h.split(".")[0]; return {owner, repo: seg||h}; }
  const [owner,repo]=FALLBACK_REPO.split("/"); return {owner,repo};
}
const GH=detectRepo();
const API=`https://api.github.com/repos/${GH.owner}/${GH.repo}`;
const TOKEN_KEY="sohat-gh-token", KEYS_KEY="sohat-keys";
let CFG={workerUrl:"",turnstileSiteKey:"",branch:"main"};

const PROCESS=["Washed","Natural","Honey","Anaerobic","Semi-washed"];
const ROASTS=["Rất sáng","Sáng","Vừa","Đậm","Rất đậm"];
const UNITS=["100g","250g","500g","1kg"];
const ORIGINS=["Cầu Đất, Đà Lạt","Lạc Dương, Lâm Đồng","Buôn Ma Thuột, Đắk Lắk","Gia Lai","Sơn La","Khe Sanh, Quảng Trị","Ethiopia Yirgacheffe","Ethiopia Guji","Kenya","Colombia Huila","Brazil Cerrado","Panama","Guatemala","Indonesia Sumatra"];
const SORTS={new:"Mới nhất",cheap:"Giá/100g: thấp → cao",dear:"Giá/100g: cao → thấp"};

const S={route:{name:"owner"},token:null,edit:false,branch:"main",filter:"Tất cả",sort:"new",del:null,delProfile:false};
const OWNER={data:{profile:{},beans:[]},loaded:false,error:null};
const COMM={index:null,loaded:false,error:null,adminIndex:null};
const PROFILES=new Map(); // id -> {doc, error}
const LOCAL=new Map();    // image path -> data URL saved this session
let KEYS={}; try{ KEYS=JSON.parse(localStorage.getItem(KEYS_KEY)||"{}")||{}; }catch(e){ KEYS={}; }
try{ const v=localStorage.getItem("sohat-sort"); if(v&&SORTS[v]) S.sort=v; }catch(e){}
const saveKeys=()=>{ try{ localStorage.setItem(KEYS_KEY,JSON.stringify(KEYS)); }catch(e){} };

/* ================= helpers ================= */
const $app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ownerPathOk=p=>typeof p==="string"&&/^images\/[A-Za-z0-9._-]+\.(jpg|jpeg|png|webp)$/.test(p);
const commPathOk=p=>typeof p==="string"&&/^community\/[a-z0-9]{10}\/img\/[a-z0-9-]+\.jpg$/.test(p);
const imgUrl=p=>LOCAL.get(p)||((ownerPathOk(p)||commPathOk(p))?p:"");
const rawUrl=p=>`https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${S.branch||CFG.branch||"main"}/${p}`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const vnd=n=>n?Number(n).toLocaleString("vi-VN")+" ₫":"";
const today=()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dayOf=b=>b.date||new Date(b.ts||0).toISOString().slice(0,10);
const fmtDate=b=>{ const [y,m,d]=dayOf(b).split("-"); return `${+d}/${+m}/${y}`; };
const fmtTime=ts=>ts?new Date(ts).toLocaleString("vi-VN",{dateStyle:"short",timeStyle:"short"}):"–";
const byDate=(a,b)=>dayOf(b).localeCompare(dayOf(a))||(b.ts||0)-(a.ts||0);
function grams(u){ const m=String(u||"").trim().toLowerCase().replace(",",".").match(/^([\d.]+)\s*(kg|kilo|g|gr|gram|lb|lbs|oz)?$/); if(!m) return null; const n=parseFloat(m[1]); if(!(n>0)) return null; return n*({kg:1000,kilo:1000,lb:453.6,lbs:453.6,oz:28.35}[m[2]]||1); }
const per100=b=>{ const g=grams(b.unit||"250g"); return b.price&&g?b.price/g*100:null; };
const beanSvg=`<svg viewBox="0 0 12 16" aria-hidden="true"><ellipse cx="6" cy="8" rx="5" ry="7" fill="var(--muted)"/><path d="M6.2 1.5c-2.2 3 2.2 6.5-.2 13" stroke="var(--sunk)" stroke-width="1.2" fill="none"/></svg>`;
const defAvatar="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#A97A4C"/><ellipse cx="20" cy="20" rx="8" ry="11" fill="#55341D"/><path d="M20.5 9.5c-3.5 4.5 3.5 10-.5 21" stroke="#A97A4C" stroke-width="1.6" fill="none"/></svg>');
function toast(m,ms=3800){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=m; document.getElementById("overlay").appendChild(t); setTimeout(()=>t.remove(),ms); }
function busy(text){ const ov=document.createElement("div"); ov.className="saving"; ov.innerHTML=`<div>${esc(text)}</div>`; document.body.appendChild(ov); return ()=>ov.remove(); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Đã sao chép."); }catch(e){ const i=document.querySelector(".keybox input"); if(i){ i.select(); } toast("Hãy chọn và sao chép thủ công."); } }
// A file committed a moment ago may not be on GitHub Pages yet: fall back to the repo's raw copy.

async function fetchJson(path){
  const r=await fetch(path+"?t="+Date.now(),{cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok){ const e=new Error("http "+r.status); e.status=r.status; throw e; }
  return r.json();
}

/* ================= GitHub (owner) ================= */
async function gh(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{"Accept":opts.raw?"application/vnd.github.raw+json":"application/vnd.github+json","Authorization":"Bearer "+S.token,"X-GitHub-Api-Version":"2022-11-28",...(opts.body?{"Content-Type":"application/json"}:{})}});
  if(r.status===404&&opts.allow404) return null;
  if(!r.ok){ const err=new Error("gh "+r.status); err.status=r.status; throw err; }
  return r.status===204?null:(opts.raw?r.text():r.json());
}
async function ghJson(path){ const t=await gh(`/contents/${path}?ref=${S.branch}`,{raw:true,allow404:true}); return t==null?null:JSON.parse(t); }
async function connect(token){
  S.token=token;
  const info=await gh("");
  if(!info.permissions||!info.permissions.push){ const e=new Error("no push"); e.status=403; throw e; }
  S.branch=info.default_branch||"main"; S.edit=true;
}
// Atomic commit. build(headSha, treeSha) → {files:[{path,content}|{path,b64}|{path,delete:true}], message}
async function ghCommit(build){
  for(let attempt=0;attempt<3;attempt++){
    const ref=await gh(`/git/ref/heads/${S.branch}`); const head=ref.object.sha;
    const base=await gh(`/git/commits/${head}`);
    const {files,message}=await build(head,base.tree.sha);
    const tree=[];
    for(const f of files){
      if(f.delete) tree.push({path:f.path,mode:"100644",type:"blob",sha:null});
      else if(f.b64!=null){ const blob=await gh("/git/blobs",{method:"POST",body:JSON.stringify({content:f.b64,encoding:"base64"})}); tree.push({path:f.path,mode:"100644",type:"blob",sha:blob.sha}); }
      else tree.push({path:f.path,mode:"100644",type:"blob",content:f.content});
    }
    const t=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:base.tree.sha,tree})});
    const c=await gh("/git/commits",{method:"POST",body:JSON.stringify({message,tree:t.sha,parents:[head]})});
    try{ await gh(`/git/refs/heads/${S.branch}`,{method:"PATCH",body:JSON.stringify({sha:c.sha})}); return; }
    catch(e){ if(e.status===422&&attempt<2) continue; throw e; }
  }
}
function ghError(e){
  if(e.status===401){ logout(); toast("Mã truy cập đã hết hạn hoặc bị thu hồi. Hãy đăng nhập lại."); }
  else if(e.status===403||e.status===404) toast("Mã truy cập không có quyền ghi vào repo này. Kiểm tra quyền Contents: Read and write.");
  else if(e.status===422) toast("Repo vừa thay đổi ở nơi khác. Tải lại trang rồi thử lại.");
  else toast("Chưa lưu được. Kiểm tra kết nối rồi thử lại.");
}

/* ================= Worker (community) ================= */
async function worker(method,path,body,key){
  if(!CFG.workerUrl) throw Object.assign(new Error("no worker"),{code:"no_worker"});
  const r=await fetch(CFG.workerUrl.replace(/\/$/,"")+path,{method,headers:{"Content-Type":"application/json",...(key?{"X-Edit-Key":key}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||"http "+r.status),{code:j.error||"http",status:r.status});
  return j;
}
function workerError(e){
  const map={captcha:"Hãy hoàn thành bước xác minh chống spam rồi thử lại.",bad_key:"Link sửa không đúng. Hãy mở lại đúng link sửa sổ của bạn.",no_key:"Thiếu link sửa sổ.",
    name_required:"Hãy nhập tên hiển thị.",too_large:"Dữ liệu gửi lên quá lớn. Thử ảnh nhỏ hơn.",image_too_large:"Ảnh quá lớn. Thử ảnh khác.",bad_image:"Ảnh không hợp lệ. Thử ảnh JPG hoặc PNG.",
    too_many_images:"Mỗi lần lưu tối đa 6 ảnh mới.",conflict:"Máy chủ đang bận. Thử lại sau vài giây.",not_found:"Không tìm thấy sổ này.",no_worker:"Tính năng tạo sổ chưa được bật.",origin:"Trang này chưa được phép gửi tới máy chủ."};
  toast(map[e.code]||"Chưa lưu được. Kiểm tra kết nối rồi thử lại.");
}

/* ================= contexts: whose book is on screen ================= */
function refs(d){ return [d.profile.avatar,...d.beans.map(b=>b.photo)].filter(Boolean); }
function ownerCtx(){
  return { kind:"owner", data:OWNER.data, canEdit:S.edit,
    async commit(next,pending,msg,commitMsg){
      const stamp=Date.now().toString(36), files=[], local=[];
      next=JSON.parse(JSON.stringify(next));
      for(const p of pending){
        const path=p.slot==="avatar"?`images/avatar-${stamp}.jpg`:`images/${p.slot}-${stamp}.jpg`;
        if(p.slot==="avatar") next.profile.avatar=path; else { const b=next.beans.find(x=>x.id===p.slot); if(b) b.photo=path; }
        files.push({path,b64:p.dataUrl.split(",")[1]}); local.push([path,p.dataUrl]);
      }
      const keep=new Set(refs(next)); const stale=refs(OWNER.data).filter(p=>!keep.has(p)&&ownerPathOk(p));
      const done=busy("Đang lưu lên GitHub…");
      try{
        await ghCommit(async(head,treeSha)=>{
          let del=[]; if(stale.length){ const cur=await gh(`/git/trees/${treeSha}?recursive=1`); const have=new Set((cur.tree||[]).map(t=>t.path)); del=stale.filter(p=>have.has(p)); }
          return {message:commitMsg,files:[...files,...del.map(path=>({path,delete:true})),{path:"data.json",content:JSON.stringify(next,null,1)+"\n"}]};
        });
        local.forEach(([p,d])=>LOCAL.set(p,d)); OWNER.data=next; render(); toast(msg+". Trang công khai cập nhật sau khoảng 1 phút.",5000); return true;
      }catch(e){ ghError(e); return false; } finally{ done(); }
    } };
}
function commCtx(id){
  const entry=PROFILES.get(id), doc=entry&&entry.doc; if(!doc) return null;
  const key=KEYS[id];
  return { kind:"comm", id, key, data:{profile:{name:doc.name,bio:doc.bio,avatar:doc.avatar},beans:doc.beans||[]}, canEdit:!!key&&!!CFG.workerUrl, doc,
    async commit(next,pending,msg){
      const body={profile:{...next.profile},beans:JSON.parse(JSON.stringify(next.beans)),images:{}};
      for(const p of pending){
        if(p.slot==="avatar"){ body.profile.avatar="new:avatar"; body.images.avatar=p.dataUrl; }
        else { const b=body.beans.find(x=>x.id===p.slot); if(b){ b.photo="new:"+b.id; body.images[b.id]=p.dataUrl; } }
      }
      const done=busy("Đang lưu…");
      try{
        const res=await worker("PUT",`/profiles/${id}`,body,key);
        const nd=res.profile;
        for(const p of pending){ const path=p.slot==="avatar"?nd.avatar:(nd.beans.find(b=>b.id===p.slot)||{}).photo; if(path) LOCAL.set(path,p.dataUrl); }
        PROFILES.set(id,{doc:nd}); patchIndex(nd); render(); toast(msg+". Mọi người thấy bản mới sau khoảng 1 phút.",5000); return true;
      }catch(e){ workerError(e); return false; } finally{ done(); }
    } };
}
function patchIndex(doc){
  if(!COMM.index) return;
  const list=(COMM.index.profiles||[]).filter(p=>p.id!==doc.id);
  list.unshift({id:doc.id,name:doc.name,avatar:doc.avatar,count:(doc.beans||[]).length,createdAt:doc.createdAt,updatedAt:doc.updatedAt});
  COMM.index={profiles:list};
}
function currentCtx(){ const r=S.route; return r.name==="owner"?ownerCtx():r.name==="profile"?commCtx(r.id):null; }

/* ================= routing ================= */
function parseHash(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,""));
  let m;
  if((m=h.match(/^u\/([a-z0-9]{10})\/k\/([A-Za-z0-9_-]{20,})$/))){ KEYS[m[1]]=m[2]; saveKeys(); history.replaceState(null,"",`#u/${m[1]}`); return {name:"profile",id:m[1],fromLink:true}; }
  if((m=h.match(/^u\/([a-z0-9]{10})$/))) return {name:"profile",id:m[1]};
  if(h==="cong-dong") return {name:"community"};
  if(h==="tao-so") return {name:"create"};
  if(h==="quan-tri") return {name:"admin"};
  return {name:"owner"};
}
function go(){ S.route=parseHash(); S.filter="Tất cả"; S.del=null; S.delProfile=false; closeSheet(); render(); ensureData(); window.scrollTo(0,0); }
window.addEventListener("hashchange",go);
async function ensureData(){
  const r=S.route;
  if(r.name==="owner"&&!OWNER.loaded) loadOwner();
  if(r.name==="community"&&!COMM.loaded) loadIndex();
  if(r.name==="profile"&&!PROFILES.has(r.id)) loadProfile(r.id);
  if(r.name==="admin"&&S.edit) loadAdmin();
}
async function loadOwner(){
  try{ const d=S.edit?await ghJson("data.json"):await fetchJson("data.json"); OWNER.data={profile:(d&&d.profile)||{},beans:Array.isArray(d&&d.beans)?d.beans:[]}; OWNER.error=null; }
  catch(e){ OWNER.error="Không tải được dữ liệu. Thử tải lại trang."; }
  OWNER.loaded=true; render();
}
async function loadIndex(){
  try{ const d=await fetchJson("community/index.json"); COMM.index={profiles:Array.isArray(d&&d.profiles)?d.profiles:[]}; COMM.error=null; }
  catch(e){ COMM.error="Không tải được danh sách. Thử tải lại trang."; }
  COMM.loaded=true; render();
}
async function loadProfile(id){
  PROFILES.set(id,{loading:true}); render();
  try{
    let d=S.edit?await ghJson(`community/${id}/profile.json`):await fetchJson(`community/${id}/profile.json`);
    if(!d&&!S.edit){ try{ const r=await fetch(rawUrl(`community/${id}/profile.json`)+"?t="+Date.now()); if(r.ok) d=await r.json(); }catch(_){} }
    PROFILES.set(id,d?{doc:d}:{error:"Không tìm thấy sổ này. Nếu vừa tạo, đợi khoảng 1 phút rồi tải lại."});
  }catch(e){ PROFILES.set(id,{error:"Không tải được sổ này. Thử tải lại trang."}); }
  render();
}
async function loadAdmin(){
  COMM.adminIndex=null; render();
  try{ const d=await ghJson("community/index.json"); COMM.adminIndex={profiles:Array.isArray(d&&d.profiles)?d.profiles:[]}; }
  catch(e){ COMM.adminIndex={error:true,profiles:[]}; }
  render();
}

function photoTag(p,alt,attrs=""){ const s=imgUrl(p); return s?`<img ${attrs} loading="lazy" alt="${esc(alt)}" src="${esc(s)}" data-p="${esc(p)}">`:""; }
function card(b,ctx){
  const has=!!imgUrl(b.photo);
  return `<article class="bean">
    <button class="ph" ${has?`data-act="zoom" aria-label="Xem ảnh lớn">${photoTag(b.photo,"Ảnh hạt "+b.name)}`:`tabindex="-1" aria-hidden="true"><span class="noimg">${beanSvg}</span>`}</button>
    <div class="body">
      <h3>${esc(b.name)}</h3>
      ${b.origin?`<div class="origin">${esc(b.origin)}</div>`:""}
      <div class="tags">${b.process?`<span class="tag">${esc(b.process)}</span>`:""}${b.roastText?`<span class="roast"><i style="background:linear-gradient(90deg,var(--r1),var(--r5))"></i>Rang ${esc(b.roastText)}</span>`:`<span class="roast"><i style="background:var(--r${Math.min(5,Math.max(1,+b.roast||3))})"></i>Rang ${esc(ROASTS[Math.min(5,Math.max(1,+b.roast||3))-1].toLowerCase())}</span>`}</div>

      ${(()=>{ const p=per100(b); return p!=null&&grams(b.unit||"250g")!==100?`<div class="per100">≈ ${vnd(Math.round(p/100)*100)} / 100g</div>`:""; })()}
      <div class="foot">${fmtDate(b)}</div>

    </div></article>`;
}
function toolbar(list){
  const extra=[...new Set(list.map(b=>b.process).filter(p=>p&&!PROCESS.includes(p)))];
  const used=["Tất cả",...PROCESS.filter(p=>list.some(b=>b.process===p)),...extra]; if(!used.includes(S.filter)) S.filter="Tất cả";
  const chips=used.length>2?`<div class="filters" role="group" aria-label="Lọc theo sơ chế">${used.map(p=>`<button class="chip" data-act="filter" data-v="${esc(p)}" aria-pressed="${p===S.filter}">${esc(p)}</button>`).join("")}</div>`:"";
  const sort=list.length>1?`<label class="sortbox">Sắp xếp<select id="sortSel">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${S.sort===k?"selected":""}>${v}</option>`).join("")}</select></label>`:"";
  return chips||sort?`<div class="toolbar">${chips}${sort}</div>`:"";
}
function sorted(list){
  const r=S.filter==="Tất cả"?list.slice():list.filter(b=>b.process===S.filter);
  if(S.sort==="new") return r.sort(byDate);
  return r.sort((a,b)=>{ const x=per100(a),y=per100(b); if(x==null&&y==null) return byDate(a,b); if(x==null) return 1; if(y==null) return -1; return S.sort==="cheap"?x-y:y-x; });
}
function bookHtml(ctx,top=""){
  const p=ctx.data.profile, list=ctx.data.beans;
  const origins=new Set(list.map(b=>(b.origin||"").trim().toLowerCase()).filter(Boolean)).size;
  const ps=list.map(per100).filter(x=>x!=null); const avg=ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length/1000)*1000:0;
  const name=p.name||(ctx.canEdit?"Thêm tên của bạn":"Sổ hạt cà phê");
  const av=imgUrl(p.avatar);
  return `${top}
  <section class="prof">
    ${av?`<img class="avatar" src="${esc(av)}" data-p="${esc(p.avatar)}" alt="">`:`<img class="avatar" src="${defAvatar}" alt="">`}
    <div style="min-width:0"><h1>${esc(name)}</h1>${p.bio?`<p>${esc(p.bio)}</p>`:(ctx.canEdit?`<p>Viết vài dòng về gu cà phê của bạn trong phần Sửa hồ sơ.</p>`:"")}</div>
    ${ctx.canEdit?`<div class="acts"><button class="btn" data-act="prof">Sửa hồ sơ</button><button class="btn primary" data-act="new">+ Thêm hạt</button></div>`:""}
  </section>
  <div class="stats"><div><b>${list.length}</b><span>loại hạt đã thử</span></div><div><b>${origins}</b><span>vùng trồng</span></div><div><b style="font-family:var(--f-mono)">${avg?vnd(avg):"–"}</b><span>giá trung bình / 100g</span></div></div>
  ${list.length?toolbar(list)+`<div class="grid">${sorted(list).map(b=>card(b,ctx)).join("")}</div>`
    :`<div class="empty"><h3>Chưa có hạt nào</h3><p>${ctx.canEdit?"Chụp ảnh túi hạt, ghi tên, sơ chế, vùng trồng, độ rang và giá mua.":"Chủ sổ chưa đăng loại hạt nào."}</p>${ctx.canEdit?`<button class="btn primary" data-act="new">+ Thêm hạt</button>`:""}</div>`}`;
}
function myBookId(){ return Object.keys(KEYS).find(id=>/^[a-z0-9]{10}$/.test(id)); }

  const r=S.route.name, mine=myBookId(), ownerName=OWNER.data.profile.name;

async function decode(f){ if(window.createImageBitmap){ try{ return await createImageBitmap(f,{imageOrientation:"from-image"}); }catch(e){} }
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(f); }); }
async function compress(f,sizes,limit){ const s=await decode(f), cv=document.createElement("canvas"), cx=cv.getContext("2d");
  for(const m of sizes){ const k=Math.min(1,m/Math.max(s.width,s.height)); cv.width=Math.round(s.width*k); cv.height=Math.round(s.height*k);
    cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(s,0,0,cv.width,cv.height);
    for(const q of [.85,.75,.65]){ const u=cv.toDataURL("image/jpeg",q); if(u.length<limit) return u; } }
  throw new Error("big"); }
function wireDrop(id,onFile){
  const d=document.getElementById(id), inp=document.getElementById(id+"-file"); if(!d||!inp) return;
  inp.addEventListener("change",()=>{ if(inp.files[0]) onFile(inp.files[0]); inp.value=""; });
  d.addEventListener("dragover",e=>{e.preventDefault();d.classList.add("over");});
  d.addEventListener("dragleave",()=>d.classList.remove("over"));
  d.addEventListener("drop",e=>{e.preventDefault();d.classList.remove("over"); const f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) onFile(f);});
}

async function adminDelete(id){
  const done=busy("Đang xoá sổ khỏi repo…");
  try{
    await ghCommit(async(head,treeSha)=>{
      const cur=await gh(`/git/trees/${treeSha}?recursive=1`);
      const paths=(cur.tree||[]).filter(t=>t.type==="blob"&&t.path.startsWith(`community/${id}/`)).map(t=>t.path);
      const idx=(await ghJson("community/index.json"))||{profiles:[]};
      const profiles=(idx.profiles||[]).filter(p=>p&&p.id!==id);
      return {message:`Quản trị xoá hồ sơ ${id}`,files:[...paths.map(path=>({path,delete:true})),{path:"community/index.json",content:JSON.stringify({profiles},null,1)+"\n"}]};
    });
    PROFILES.delete(id); if(COMM.adminIndex) COMM.adminIndex.profiles=COMM.adminIndex.profiles.filter(p=>p.id!==id);
    if(COMM.index) COMM.index.profiles=COMM.index.profiles.filter(p=>p.id!==id);
    render(); toast("Đã xoá sổ. Trang công khai cập nhật sau khoảng 1 phút.",5000);
  }catch(e){ ghError(e); render(); } finally{ done(); }
}

    if(F.picNew) pending.push({slot:"avatar",dataUrl:F.picNew}); else if(!F.pic) avatar="";
    const next={...ctx.data,profile:{name,bio:document.getElementById("p-bio").value.trim(),avatar}};
    if(await ctx.commit(next,pending,"Đã lưu hồ sơ","Cập nhật hồ sơ")) closeSheet();
    return;
  }
  const name=document.getElementById("f-name").value.trim(); if(!name){ toast("Hãy nhập tên hạt."); return; }
  let unit=(F.unit||"250g").trim()||"250g"; if(/^\d+([.,]\d+)?$/.test(unit)) unit+="g";
  const id=F.id||uid(); const pending=[]; let photo=F.photo||"";
  if(F.picNew) pending.push({slot:id,dataUrl:F.picNew}); else if(!F.pic) photo="";
  const bean={ id, ts:F.ts||Date.now(), date:document.getElementById("f-date").value||today(), name, process:(F.process||"").trim(),
    origin:document.getElementById("f-origin").value.trim(), roast:+F.roast||3, roastText:(F.roastText||"").trim(),
    price:Number(document.getElementById("f-price").value.replace(/\D/g,""))||0, unit, photo };
  const beans=[...ctx.data.beans], i=beans.findIndex(x=>x.id===id); if(i>=0) beans[i]=bean; else beans.push(bean);
  if(await ctx.commit({...ctx.data,beans},pending,i>=0?"Đã lưu thay đổi":"Đã đăng hạt",(i>=0?"Sửa hạt: ":"Thêm hạt: ")+name)) closeSheet();
});

/* ================= boot ================= */
(async()=>{
  try{ const c=await fetchJson("config.json"); if(c) CFG={...CFG,...c}; }catch(e){}
  S.branch=CFG.branch||"main";
  let tok=null; try{ tok=localStorage.getItem(TOKEN_KEY); }catch(e){}
  if(tok){ try{ await connect(tok); }catch(e){ S.token=null; S.edit=false; if(e.status===401){ try{ localStorage.removeItem(TOKEN_KEY); }catch(_){} } } }
  S.route=parseHash(); render(); ensureData();
  if(S.route.name!=="owner") loadOwner();
})();
})();
</script>
