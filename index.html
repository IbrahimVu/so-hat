<style data-p>
/* Layout: one person's bean journal — profile header with stats, a filter/sort bar, then a photo-led grid; owner-only editing in a side sheet */
:root{
  --bg:#F3F4EE; --surface:#FFFFFF; --sunk:#E9EBE2; --ink:#231A15; --muted:#6B655C; --line:#D9DAD0;
  --accent:#9A2E3D; --accent-ink:#FFFFFF; --accent-soft:#F3E3E4; --leaf:#55704A; --leaf-soft:#E3EBDD;
  --r1:#CDA77D; --r2:#A97A4C; --r3:#7C5131; --r4:#55341D; --r5:#2C1B11;
  --f-display:"Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15110E; --surface:#1F1915; --sunk:#2A221D; --ink:#F0E8E0; --muted:#A79D92; --line:#3A302A;
  --accent:#E5838F; --accent-ink:#1C0F11; --accent-soft:#3A2024; --leaf:#A3BC94; --leaf-soft:#25301F;
  --r1:#D9B58C; --r2:#B98858; --r3:#8E603C; --r4:#6A4428; --r5:#4A2E1C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15110E; --surface:#1F1915; --sunk:#2A221D; --ink:#F0E8E0; --muted:#A79D92; --line:#3A302A;
  --accent:#E5838F; --accent-ink:#1C0F11; --accent-soft:#3A2024; --leaf:#A3BC94; --leaf-soft:#25301F;
  --r1:#D9B58C; --r2:#B98858; --r3:#8E603C; --r4:#6A4428; --r5:#4A2E1C; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

.bar{border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;gap:8px;align-items:center}
.brand svg{width:20px;height:26px}
.editchip{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.6;cursor:wait}

.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:28px 90px}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:22px}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--sunk);display:block}
.prof h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.03em}
.prof p{margin:8px 0 0;color:var(--muted);max-width:62ch;white-space:pre-wrap}
.prof .acts{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:24px}
.stats div{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:12.5px;color:var(--muted)}

.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.filters{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.sortbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto}
.sortbox select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.bean{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:4/3;background:var(--sunk);display:block;border:0;padding:0;width:100%;position:relative}
.ph{overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center}
.ph .noimg svg{width:34px;height:46px;opacity:.5}
.body{padding:12px 14px 14px;display:grid;gap:8px;flex:1}
.body h3{font-size:18px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.origin{font-size:13.5px;color:var(--muted);margin-top:-4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf);white-space:nowrap}
.roast{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.roast i{width:22px;height:8px;border-radius:2px;display:inline-block}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.price b{font-family:var(--f-mono);font-size:17px}
.price span{font-size:12px;color:var(--muted)}
.per100{font-size:12px;color:var(--muted);font-family:var(--f-mono);text-align:right;margin-top:-4px}
.foot{font-size:12.5px;color:var(--muted)}
.acts2{display:flex;gap:4px;flex-wrap:wrap}

.empty{border:1.5px dashed var(--line);border-radius:16px;padding:26px;display:grid;gap:12px;justify-items:start}
.empty h3{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:54ch}
.meter{font-size:12.5px;color:var(--muted);margin-top:28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meter .t{width:160px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter .t i{display:block;height:100%;background:var(--leaf)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 6 4 / .45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:21px;font-weight:800}
.sheet-b{overflow-y:auto;padding:18px;display:grid;gap:18px}
.sheet-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface)}
.field{display:grid;gap:6px}
.lbl{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.roastpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.roastpick button{border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;background:var(--surface);display:grid;font-size:11.5px}
.roastpick button i{height:26px;display:block}
.roastpick button span{padding:4px 2px}
.roastpick button[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.pricebox{position:relative}
.pricebox input{font-family:var(--f-mono);padding-right:30px}
.pricebox span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.unitrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.unitrow input{width:118px;padding:5px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.unitrow input.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.row2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);aspect-ratio:4/3;max-height:260px;width:100%;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;text-align:center;padding:12px}
.drop.round{aspect-ratio:1;max-height:none;width:120px;border-radius:50%;padding:6px;font-size:12px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .rm{position:absolute;top:8px;right:8px;z-index:2}
.drop .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgb(0 0 0 / .45);color:#fff;font-size:13px;z-index:1}

.saving{position:fixed;inset:0;z-index:90;background:rgb(10 6 4 / .35);display:grid;place-items:center}
.saving div{background:var(--surface);color:var(--ink);padding:14px 20px;border-radius:12px;font-weight:600}
.lightbox{position:fixed;inset:0;z-index:70;background:rgb(8 5 3 / .88);display:grid;place-items:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:95;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:640px){ .prof{grid-template-columns:auto minmax(0,1fr)} .prof .acts{grid-column:1/-1} .avatar{width:64px;height:64px} }
@media (max-width:520px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .body{padding:10px} .body h3{font-size:16px} .stats b{font-size:20px} .stats b[style]{font-size:15px} .stats div{padding:10px 12px} .row2{grid-template-columns:minmax(0,1fr)} }
@media (max-width:360px){ .grid{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:sl .2s ease-out} @keyframes sl{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}} }
</style>

<script data-p>
(() => {
const SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
// Capture the page's own source before anything renders, so a save can rebuild the document.
const PARTS=[...document.body.children].filter(e=>e.hasAttribute("data-p")).map(e=>e.id==="sohat-data"?null:e.outerHTML);
const CAN_SAVE=PARTS.length>=8&&PARTS.includes(null);
let DATA; try{ DATA=JSON.parse(document.getElementById("sohat-data").textContent); }catch(e){ DATA={profile:{},beans:[]}; }
DATA.profile=DATA.profile||{}; DATA.beans=DATA.beans||[];

const PROCESS=["Washed","Natural","Honey","Anaerobic","Semi-washed"];
const ROASTS=["Rất sáng","Sáng","Vừa","Đậm","Rất đậm"];
const UNITS=["100g","250g","500g","1kg"];
const ORIGINS=["Cầu Đất, Đà Lạt","Lạc Dương, Lâm Đồng","Buôn Ma Thuột, Đắk Lắk","Gia Lai","Sơn La","Khe Sanh, Quảng Trị","Ethiopia Yirgacheffe","Ethiopia Guji","Kenya","Colombia Huila","Brazil Cerrado","Panama","Guatemala","Indonesia Sumatra"];
const SORTS={new:"Mới nhất",cheap:"Giá/100g: thấp → cao",dear:"Giá/100g: cao → thấp"};
const MAX=15.5e6;
const S={edit:false,art:null,filter:"Tất cả",sort:"new",del:null};
try{ const v=localStorage.getItem("sohat-sort"); if(v&&SORTS[v]) S.sort=v; }catch(e){}
const $app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okImg=s=>typeof s==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const vnd=n=>n?Number(n).toLocaleString("vi-VN")+" ₫":"";
const today=()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dayOf=b=>b.date||new Date(b.ts||0).toISOString().slice(0,10);
const fmtDate=b=>{ const [y,m,d]=dayOf(b).split("-"); return `${+d}/${+m}/${y}`; };
const byDate=(a,b)=>dayOf(b).localeCompare(dayOf(a))||(b.ts||0)-(a.ts||0);
function grams(u){ const m=String(u||"").trim().toLowerCase().replace(",",".").match(/^([\d.]+)\s*(kg|kilo|g|gr|gram|lb|lbs|oz)?$/); if(!m) return null; const n=parseFloat(m[1]); if(!(n>0)) return null; return n*({kg:1000,kilo:1000,lb:453.6,lbs:453.6,oz:28.35}[m[2]]||1); }
const per100=b=>{ const g=grams(b.unit||"250g"); return b.price&&g?b.price/g*100:null; };
const beanSvg=`<svg viewBox="0 0 12 16" aria-hidden="true"><ellipse cx="6" cy="8" rx="5" ry="7" fill="var(--muted)"/><path d="M6.2 1.5c-2.2 3 2.2 6.5-.2 13" stroke="var(--sunk)" stroke-width="1.2" fill="none"/></svg>`;
const defAvatar="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#A97A4C"/><ellipse cx="20" cy="20" rx="8" ry="11" fill="#55341D"/><path d="M20.5 9.5c-3.5 4.5 3.5 10-.5 21" stroke="#A97A4C" stroke-width="1.6" fill="none"/></svg>');
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=m; document.getElementById("overlay").appendChild(t); setTimeout(()=>t.remove(),3400); }

/* ---------- serialize & save ---------- */
function docFor(data){
  const json=JSON.stringify(data).replace(/</g,"\\u003c");
  const body=PARTS.map(p=>p===null?`<script data-p type="application/json" id="sohat-data">${json}<\/script>`:p).join("\n");
  return SKEL+body+"</body></html>";
}
let saving=false;
async function save(next,msg){
  if(!S.edit||!S.art||saving) return false;
  const html=docFor(next);
  if(html.length>MAX){ toast("Trang đã gần đầy dung lượng. Xoá bớt hạt cũ hoặc dùng ảnh nhỏ hơn."); return false; }
  saving=true; const ov=document.createElement("div"); ov.className="saving"; ov.innerHTML="<div>Đang lưu…</div>"; document.body.appendChild(ov);
  try{ try{ sessionStorage.setItem("sohat-msg",msg||"Đã lưu"); }catch(e){}
    await S.art.publish(html); return true; }
  catch(e){
    try{ sessionStorage.removeItem("sohat-msg"); }catch(_){}
    const c=e&&e.code;
    if(c==="conflict") toast("Trang vừa được cập nhật ở nơi khác. Đang tải bản mới, bạn làm lại thao tác nhé.");
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"){ S.edit=false; render(); toast("Bạn chỉ có quyền xem trang này."); }
    else if(c==="too_large") toast("Trang vượt giới hạn dung lượng. Xoá bớt hạt hoặc ảnh.");
    else if(c==="rate_limited") toast("Lưu hơi dồn dập. Đợi vài giây rồi thử lại.");
    else toast("Chưa lưu được. Kiểm tra kết nối rồi thử lại.");
    return false;
  } finally { saving=false; ov.remove(); }
}

/* ---------- render ---------- */
function card(b){
  return `<article class="bean">
    <button class="ph" ${okImg(b.photo)?`data-act="zoom" data-id="${esc(b.id)}" aria-label="Xem ảnh lớn"><img loading="lazy" alt="Ảnh hạt ${esc(b.name)}" src="${b.photo}">`:`tabindex="-1" aria-hidden="true"><span class="noimg">${beanSvg}</span>`}</button>
    <div class="body">
      <h3>${esc(b.name)}</h3>
      ${b.origin?`<div class="origin">${esc(b.origin)}</div>`:""}
      <div class="tags">${b.process?`<span class="tag">${esc(b.process)}</span>`:""}${b.roastText?`<span class="roast"><i style="background:linear-gradient(90deg,var(--r1),var(--r5))"></i>Rang ${esc(b.roastText)}</span>`:`<span class="roast"><i style="background:var(--r${+b.roast||3})"></i>Rang ${esc(ROASTS[(+b.roast||3)-1].toLowerCase())}</span>`}</div>
      <div class="price">${b.price?`<b>${vnd(b.price)}</b><span>/ ${esc(b.unit||"250g")}</span>`:`<span>Chưa có giá</span>`}</div>
      ${(()=>{ const p=per100(b); return p!=null&&grams(b.unit||"250g")!==100?`<div class="per100">≈ ${vnd(Math.round(p/100)*100)} / 100g</div>`:""; })()}
      <div class="foot">${fmtDate(b)}</div>
      ${S.edit?(S.del===b.id?`<div class="acts2"><span style="font-size:13px;align-self:center">Xoá hạt này?</span><button class="btn sm primary" data-act="del" data-id="${esc(b.id)}">Xoá</button><button class="btn sm" data-act="nodel">Giữ</button></div>`:`<div class="acts2"><button class="btn sm" data-act="edit" data-id="${esc(b.id)}">Sửa</button><button class="btn sm ghost" data-act="askdel" data-id="${esc(b.id)}">Xoá</button></div>`):""}
    </div></article>`;
}
function toolbar(list){
  const extra=[...new Set(list.map(b=>b.process).filter(p=>p&&!PROCESS.includes(p)))];
  const used=["Tất cả",...PROCESS.filter(p=>list.some(b=>b.process===p)),...extra]; if(!used.includes(S.filter)) S.filter="Tất cả";
  const chips=used.length>2?`<div class="filters" role="group" aria-label="Lọc theo sơ chế">${used.map(p=>`<button class="chip" data-act="filter" data-v="${esc(p)}" aria-pressed="${p===S.filter}">${esc(p)}</button>`).join("")}</div>`:"";
  const sort=list.length>1?`<label class="sortbox">Sắp xếp<select id="sortSel">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${S.sort===k?"selected":""}>${v}</option>`).join("")}</select></label>`:"";
  return chips||sort?`<div class="toolbar">${chips}${sort}</div>`:"";
}
function view(list){
  const r=S.filter==="Tất cả"?list.slice():list.filter(b=>b.process===S.filter);
  if(S.sort==="new") return r.sort(byDate);
  return r.sort((a,b)=>{ const x=per100(a),y=per100(b); if(x==null&&y==null) return byDate(a,b); if(x==null) return 1; if(y==null) return -1; return S.sort==="cheap"?x-y:y-x; });
}
function render(){
  document.getElementById("editchip").hidden=!S.edit;
  const p=DATA.profile, list=DATA.beans;
  const origins=new Set(list.map(b=>(b.origin||"").trim().toLowerCase()).filter(Boolean)).size;
  const ps=list.map(per100).filter(x=>x!=null); const avg=ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length/1000)*1000:0;
  const name=p.name||(S.edit?"Thêm tên của bạn":"Sổ hạt cà phê");
  const size=docFor(DATA).length;
  $app.innerHTML=`
  <section class="prof">
    <img class="avatar" src="${okImg(p.avatar)?p.avatar:defAvatar}" alt="">
    <div style="min-width:0"><h1>${esc(name)}</h1>${p.bio?`<p>${esc(p.bio)}</p>`:(S.edit?`<p>Viết vài dòng về gu cà phê của bạn trong phần Sửa hồ sơ.</p>`:"")}</div>
    ${S.edit?`<div class="acts"><button class="btn" data-act="prof">Sửa hồ sơ</button><button class="btn primary" data-act="new">+ Thêm hạt</button></div>`:""}
  </section>
  <div class="stats"><div><b>${list.length}</b><span>loại hạt đã thử</span></div><div><b>${origins}</b><span>vùng trồng</span></div><div><b style="font-family:var(--f-mono)">${avg?vnd(avg):"–"}</b><span>giá trung bình / 100g</span></div></div>
  ${list.length?toolbar(list)+`<div class="grid">${view(list).map(card).join("")}</div>`
    :`<div class="empty"><h3>Chưa có hạt nào</h3><p>${S.edit?"Chụp ảnh túi hạt, ghi tên, sơ chế, vùng trồng, độ rang và giá mua.":"Chủ sổ chưa đăng loại hạt nào."}</p>${S.edit?`<button class="btn primary" data-act="new">+ Thêm hạt</button>`:""}</div>`}
  ${S.edit?`<div class="meter"><span>Dung lượng trang</span><span class="t"><i style="width:${Math.min(100,size/MAX*100).toFixed(1)}%"></i></span><span>${(size/1e6).toFixed(1)} / ${(MAX/1e6).toFixed(1)} MB</span></div>`:""}`;
}

/* ---------- images ---------- */
async function decode(f){ if(window.createImageBitmap){ try{ return await createImageBitmap(f,{imageOrientation:"from-image"}); }catch(e){} }
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(f); }); }
async function compress(f,sizes,limit){ const s=await decode(f), cv=document.createElement("canvas"), cx=cv.getContext("2d");
  for(const m of sizes){ const k=Math.min(1,m/Math.max(s.width,s.height)); cv.width=Math.round(s.width*k); cv.height=Math.round(s.height*k);
    cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(s,0,0,cv.width,cv.height);
    for(const q of [.8,.7,.6]){ const u=cv.toDataURL("image/jpeg",q); if(u.length<limit) return u; } }
  throw new Error("big"); }
function wireDrop(id,onFile){
  const d=document.getElementById(id), inp=document.getElementById(id+"-file");
  inp.addEventListener("change",()=>{ if(inp.files[0]) onFile(inp.files[0]); inp.value=""; });
  d.addEventListener("dragover",e=>{e.preventDefault();d.classList.add("over");});
  d.addEventListener("dragleave",()=>d.classList.remove("over"));
  d.addEventListener("drop",e=>{e.preventDefault();d.classList.remove("over"); const f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) onFile(f);});
}

/* ---------- bean form ---------- */
let F=null;
function sheet(title,inner,submit){
  document.getElementById("sheetRoot").innerHTML=`<div class="scrim" data-act="close"></div>
  <form class="sheet" id="f" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button type="button" class="btn ghost sm" data-act="close" style="margin-left:auto">Đóng</button></div>
  <div class="sheet-b">${inner}</div><div class="sheet-f"><button type="button" class="btn" data-act="close">Huỷ</button><button type="submit" class="btn primary">${esc(submit)}</button></div></form>`;
}
function openBean(b){
  F=b?{...b,pic:okImg(b.photo)?b.photo:null}:{kind:"bean",id:null,name:"",date:today(),process:"",origin:"",roast:3,roastText:"",price:0,unit:"250g",pic:null};
  F.kind="bean"; F.busy=false; if(!F.date) F.date=dayOf(F);
  const chip=(k,v,on)=>`<button type="button" class="chip" data-chip="${k}" data-v="${esc(v)}" aria-pressed="${on}">${esc(v)}</button>`;
  const cProc=F.process&&!PROCESS.includes(F.process), cUnit=!UNITS.includes(F.unit);
  sheet(F.id?"Sửa hạt":"Thêm hạt",`
    <div class="field"><span class="lbl">Hình ảnh</span><label class="drop" id="drop" for="drop-file"></label><input type="file" id="drop-file" accept="image/*" hidden></div>
    <div class="row2">
      <div class="field"><label class="lbl" for="f-name">Tên hạt</label><input id="f-name" required maxlength="100" value="${esc(F.name)}" placeholder="Arabica Cầu Đất, Ethiopia Guji…"></div>
      <div class="field"><label class="lbl" for="f-date">Ngày</label><input id="f-date" type="date" required value="${esc(F.date)}"></div>
    </div>
    <div class="field"><span class="lbl">Sơ chế</span><div class="unitrow" role="group" aria-label="Sơ chế">${PROCESS.map(v=>chip("process",v,F.process===v)).join("")}<input id="f-proc" maxlength="30" placeholder="Khác: Carbonic…" aria-label="Kiểu sơ chế khác" value="${cProc?esc(F.process):""}" class="${cProc?"on":""}" style="width:150px"></div></div>
    <div class="field"><label class="lbl" for="f-origin">Vùng trồng</label><input id="f-origin" list="dl-o" maxlength="80" value="${esc(F.origin)}" placeholder="Cầu Đất, Đà Lạt"><datalist id="dl-o">${ORIGINS.map(o=>`<option value="${esc(o)}">`).join("")}</datalist></div>
    <div class="field"><span class="lbl">Ngưỡng rang</span><div class="roastpick" role="group">${ROASTS.map((r,i)=>`<button type="button" data-chip="roast" data-v="${i+1}" aria-pressed="${!F.roastText&&+F.roast===i+1}"><i style="background:var(--r${i+1})"></i><span>${r}</span></button>`).join("")}</div>
      <div class="unitrow"><input id="f-roast" maxlength="40" placeholder="Khác: Medium-light, Omni, Agtron 65…" aria-label="Ngưỡng rang khác" value="${esc(F.roastText||"")}" class="${F.roastText?"on":""}" style="width:100%;max-width:320px"></div></div>
    <div class="field"><label class="lbl" for="f-price">Giá bán</label><div class="pricebox"><input id="f-price" inputmode="numeric" maxlength="13" value="${F.price?Number(F.price).toLocaleString("vi-VN"):""}" placeholder="180.000"><span>₫</span></div>
      <div class="unitrow" role="group" aria-label="Khối lượng">${UNITS.map(v=>chip("unit",v,F.unit===v)).join("")}<input id="f-unit" maxlength="10" placeholder="Khác: 300g" aria-label="Khối lượng khác" value="${cUnit?esc(F.unit||""):""}" class="${cUnit?"on":""}"></div></div>`,
    F.id?"Lưu":"Đăng hạt");
  drawDrop(); wireDrop("drop",async f=>{ F.busy=true; drawDrop(); try{ F.pic=await compress(f,[1080,900,720,560],170000); }catch(e){ toast("Không đọc được ảnh này. Thử ảnh JPG hoặc PNG."); } F.busy=false; drawDrop(); });
  const pr=document.getElementById("f-price"); pr.addEventListener("input",()=>{ const n=pr.value.replace(/\D/g,"").slice(0,10); pr.value=n?Number(n).toLocaleString("vi-VN"):""; });
  const free=(id,key,group,clearChips)=>{ const el=document.getElementById(id); el.addEventListener("input",()=>{ const v=el.value.trim(); el.classList.toggle("on",!!v); F[key]=v; if(v||clearChips) document.querySelectorAll(`[data-chip="${group}"]`).forEach(b=>b.setAttribute("aria-pressed",String(group==="roast"&&!v&&+b.dataset.v===+F.roast))); }); };
  free("f-roast","roastText","roast",true); free("f-proc","process","process",true); free("f-unit","unit","unit",false);
  setTimeout(()=>document.getElementById("f-name")?.focus(),50);
}
function drawDrop(){ const d=document.getElementById("drop"); if(!d||!F) return;
  d.innerHTML=F.pic?`<img src="${F.pic}" alt=""><button type="button" class="btn sm rm" data-act="rmpic">Bỏ ảnh</button>${F.busy?`<span class="busy">Đang nén…</span>`:""}`
    :F.busy?`<span class="muted">Đang nén ảnh…</span>`:`<span><b>Chọn ảnh túi hạt</b><br><span class="muted" style="font-size:13px">hoặc kéo thả ảnh vào đây</span></span>`; }

/* ---------- profile form ---------- */
function openProfile(){
  const p=DATA.profile; F={kind:"prof",pic:okImg(p.avatar)?p.avatar:null,busy:false};
  sheet("Sửa hồ sơ",`
    <div class="field"><span class="lbl">Ảnh đại diện</span><label class="drop round" id="av" for="av-file"></label><input type="file" id="av-file" accept="image/*" hidden></div>
    <div class="field"><label class="lbl" for="p-name">Tên hiển thị</label><input id="p-name" maxlength="60" value="${esc(p.name||"")}" placeholder="Tên của bạn"></div>
    <div class="field"><label class="lbl" for="p-bio">Giới thiệu</label><textarea id="p-bio" maxlength="400" placeholder="Ví dụ: Mê hạt Natural và Anaerobic, pha pour-over mỗi sáng.">${esc(p.bio||"")}</textarea></div>`,"Lưu hồ sơ");
  const draw=()=>{ const d=document.getElementById("av"); if(d) d.innerHTML=F.pic?`<img src="${F.pic}" alt="">`:F.busy?"Đang nén…":"Chọn ảnh"; };
  draw(); wireDrop("av",async f=>{ F.busy=true; draw(); try{ F.pic=await compress(f,[320,240],60000); }catch(e){ toast("Không đọc được ảnh này."); } F.busy=false; draw(); });
}
function closeSheet(){ document.getElementById("sheetRoot").innerHTML=""; F=null; }

/* ---------- events ---------- */
document.addEventListener("change",e=>{ if(e.target.id==="sortSel"){ S.sort=e.target.value; try{localStorage.setItem("sohat-sort",S.sort)}catch(_){} render(); } });
document.addEventListener("click",ev=>{
  const c=ev.target.closest("[data-chip]");
  if(c&&F&&F.kind==="bean"){ const k=c.dataset.chip; let v=c.dataset.v;
    const clr=id=>{ const el=document.getElementById(id); if(el){ el.value=""; el.classList.remove("on"); } };
    if(k==="process") clr("f-proc"); if(k==="unit") clr("f-unit"); if(k==="roast"){ v=+v; F.roastText=""; clr("f-roast"); }
    F[k]=(k==="process"&&F[k]===v)?"":v;
    c.parentElement.querySelectorAll("[data-chip]").forEach(b=>b.setAttribute("aria-pressed",String((k==="roast"?+b.dataset.v:b.dataset.v)===F[k]))); return; }
  const a=ev.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act;
  if(act==="filter"){ S.filter=a.dataset.v; render(); }
  else if(act==="zoom"){ const b=DATA.beans.find(x=>x.id===a.dataset.id); if(!b||!okImg(b.photo)) return; const o=document.createElement("div"); o.className="lightbox"; o.innerHTML=`<img src="${b.photo}" alt="">`; o.onclick=()=>o.remove(); document.getElementById("overlay").appendChild(o); }
  else if(!S.edit) return;
  else if(act==="new") openBean();
  else if(act==="prof") openProfile();
  else if(act==="close") closeSheet();
  else if(act==="rmpic"){ ev.preventDefault(); F.pic=null; drawDrop(); }
  else if(act==="edit"){ const b=DATA.beans.find(x=>x.id===a.dataset.id); if(b) openBean(b); }
  else if(act==="askdel"){ S.del=a.dataset.id; render(); }
  else if(act==="nodel"){ S.del=null; render(); }
  else if(act==="del"){ const id=a.dataset.id; S.del=null; save({...DATA,beans:DATA.beans.filter(x=>x.id!==id)},"Đã xoá hạt").then(ok=>{ if(!ok) render(); }); }
});
document.addEventListener("keydown",e=>{ if(e.key!=="Escape") return; const lb=document.querySelector(".lightbox"); if(lb) lb.remove(); else if(F) closeSheet(); });
document.addEventListener("submit",async ev=>{
  ev.preventDefault(); if(!F||!S.edit) return;
  if(F.busy){ toast("Đợi ảnh nén xong nhé."); return; }
  if(F.kind==="prof"){
    const profile={name:document.getElementById("p-name").value.trim(),bio:document.getElementById("p-bio").value.trim(),avatar:F.pic||""};
    await save({...DATA,profile},"Đã lưu hồ sơ"); return;
  }
  const name=document.getElementById("f-name").value.trim(); if(!name){ toast("Hãy nhập tên hạt."); return; }
  let unit=(F.unit||"250g").trim()||"250g"; if(/^\d+([.,]\d+)?$/.test(unit)) unit+="g";
  const bean={ id:F.id||uid(), ts:F.ts||Date.now(), date:document.getElementById("f-date").value||today(), name, process:(F.process||"").trim(),
    origin:document.getElementById("f-origin").value.trim(), roast:+F.roast||3, roastText:(F.roastText||"").trim(),
    price:Number(document.getElementById("f-price").value.replace(/\D/g,""))||0, unit, photo:F.pic||"" };
  const beans=[...DATA.beans], i=beans.findIndex(x=>x.id===bean.id); if(i>=0) beans[i]=bean; else beans.push(bean);
  await save({...DATA,beans},i>=0?"Đã lưu thay đổi":"Đã đăng hạt");
});

/* ---------- boot ---------- */
render();
try{ const m=sessionStorage.getItem("sohat-msg"); if(m){ sessionStorage.removeItem("sohat-msg"); toast(m); } }catch(e){}
(async()=>{
  if(!(window.claude&&window.claude.use)) return;
  const [user,art]=await Promise.all([window.claude.use("user"),window.claude.use("artifact")]);
  if(!user||!art) return;
  if(CAN_SAVE&&await user.canEdit()){ S.edit=true; S.art=art; render(); }
})();
})();
</script>

</body></html>
